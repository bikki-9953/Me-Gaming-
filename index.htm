<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Car Racing Game</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  user-select: none;
}

body {
  background: #111;
  font-family: Arial, sans-serif;
  overflow: hidden;
  text-align: center;
}

h1 {
  color: white;
  margin: 12px 0 5px;
  font-size: 25px;
}

#score {
  color: #00ff88;
  font-size: 20px;
  margin-bottom: 8px;
}

#game {
  position: relative;
  width: 360px;
  max-width: 95vw;
  height: 560px;
  max-height: 72vh;
  margin: auto;
  overflow: hidden;
  background: #555;
  border-left: 8px solid #222;
  border-right: 8px solid #222;
}

/* Road lines */
.line {
  position: absolute;
  width: 8px;
  height: 80px;
  background: white;
  left: 50%;
  transform: translateX(-50%);
}

/* Player car */
#player {
  position: absolute;
  width: 55px;
  height: 90px;
  background: red;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  border-radius: 12px;
  border: 4px solid white;
  z-index: 5;
}

/* Car windows */
#player::before {
  content: "";
  position: absolute;
  width: 35px;
  height: 25px;
  background: #222;
  left: 6px;
  top: 8px;
  border-radius: 5px;
}

#player::after {
  content: "🏎️";
  position: absolute;
  font-size: 25px;
  left: 10px;
  bottom: 5px;
}

/* Enemy cars */
.enemy {
  position: absolute;
  width: 55px;
  height: 90px;
  background: yellow;
  border-radius: 12px;
  border: 4px solid #222;
  z-index: 4;
}

.enemy::before {
  content: "";
  position: absolute;
  width: 35px;
  height: 25px;
  background: #333;
  left: 6px;
  top: 8px;
  border-radius: 5px;
}

/* Start screen */
#startScreen {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.85);
  color: white;
  z-index: 20;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}

#startScreen h2 {
  font-size: 30px;
  margin-bottom: 15px;
}

button {
  border: none;
  border-radius: 12px;
  padding: 15px 25px;
  font-size: 20px;
  font-weight: bold;
  background: #00eaff;
  color: #111;
}

#controls {
  width: 360px;
  max-width: 95vw;
  margin: 12px auto;
  display: flex;
  justify-content: space-between;
}

.control {
  width: 120px;
  height: 55px;
  font-size: 28px;
  background: #00eaff;
  border-radius: 15px;
}

#gameOver {
  display: none;
  position: absolute;
  inset: 0;
  z-index: 30;
  background: rgba(0,0,0,0.9);
  color: white;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}

#gameOver h2 {
  color: red;
  font-size: 35px;
  margin-bottom: 15px;
}
</style>
</head>

<body>

<h1>🏎️ CAR RACING</h1>
<div id="score">Score: 0</div>

<div id="game">

  <div id="startScreen">
    <h2>🏁 CAR RACING</h2>
    <p style="margin-bottom:20px;">Avoid the enemy cars!</p>
    <button onclick="startGame()">START GAME</button>
  </div>

  <div id="gameOver">
    <h2>GAME OVER</h2>
    <p id="finalScore">Score: 0</p>
    <br>
    <button onclick="restartGame()">PLAY AGAIN</button>
  </div>

  <div id="player"></div>
</div>

<div id="controls">
  <button class="control" id="left">⬅️</button>
  <button class="control" id="right">➡️</button>
</div>

<script>
const game = document.getElementById("game");
const player = document.getElementById("player");
const scoreText = document.getElementById("score");
const startScreen = document.getElementById("startScreen");
const gameOverScreen = document.getElementById("gameOver");
const finalScore = document.getElementById("finalScore");

let playerX = 152;
let score = 0;
let gameRunning = false;
let speed = 5;
let enemies = [];
let lines = [];
let animationId;
let enemyTimer;

function createRoadLines() {
  for (let i = 0; i < 6; i++) {
    let line = document.createElement("div");
    line.className = "line";
    line.style.top = (i * 100 - 100) + "px";
    game.appendChild(line);
    lines.push(line);
  }
}

createRoadLines();

function startGame() {
  startScreen.style.display = "none";
  gameOverScreen.style.display = "none";

  score = 0;
  speed = 5;
  playerX = 152;
  player.style.left = playerX + "px";

  enemies.forEach(e => e.remove());
  enemies = [];

  gameRunning = true;

  enemyTimer = setInterval(createEnemy, 900);
  gameLoop();
}

function createEnemy() {
  if (!gameRunning) return;

  const enemy = document.createElement("div");
  enemy.className = "enemy";

  const maxX = game.clientWidth - 63;
  const x = Math.floor(Math.random() * maxX);

  enemy.style.left = x + "px";
  enemy.style.top = "-100px";

  game.appendChild(enemy);
  enemies.push(enemy);
}

function gameLoop() {
  if (!gameRunning) return;

  // Road movement
  lines.forEach(line => {
    let y = parseFloat(line.style.top);
    y += speed;

    if (y > game.clientHeight) {
      y = -80;
    }

    line.style.top = y + "px";
  });

  // Enemy movement
  enemies.forEach((enemy, index) => {
    let y = parseFloat(enemy.style.top);
    y += speed;
    enemy.style.top = y + "px";

    // Collision
    if (collision(player, enemy)) {
      endGame();
    }

    // Remove enemy
    if (y > game.clientHeight) {
      enemy.remove();
      enemies.splice(index, 1);

      score++;
      scoreText.textContent = "Score: " + score;

      if (score % 10 === 0) {
        speed += 0.5;
      }
    }
  });

  animationId = requestAnimationFrame(gameLoop);
}

function collision(a, b) {
  const r1 = a.getBoundingClientRect();
  const r2 = b.getBoundingClientRect();

  return !(
    r1.bottom < r2.top ||
    r1.top > r2.bottom ||
    r1.right < r2.left ||
    r1.left > r2.right
  );
}

function moveLeft() {
  if (!gameRunning) return;

  playerX -= 30;

  if (playerX < 5) {
    playerX = 5;
  }

  player.style.left = playerX + "px";
}

function moveRight() {
  if (!gameRunning) return;

  playerX += 30;

  const maxX = game.clientWidth - 60;

  if (playerX > maxX) {
    playerX = maxX;
  }

  player.style.left = playerX + "px";
}

document.getElementById("left").addEventListener("click", moveLeft);
document.getElementById("right").addEventListener("click", moveRight);

function endGame() {
  gameRunning = false;

  clearInterval(enemyTimer);
  cancelAnimationFrame(animationId);

  finalScore.textContent = "Your Score: " + score;
  gameOverScreen.style.display = "flex";
}

function restartGame() {
  startGame();
}
</script>

</body>
        </html>
